[package]
name = "plugin_ai_chat"
version = "5.2.2-beta.6"
edition = "2024"
description = "AI 对话插件"
authors = ["luoy-oss"]

[package.metadata]
tags = ["ai", "chat"]

[features]
default = ["plugin"]
plugin = []

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
luo9_sdk = "0.8.0-beta.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
ureq = "3.3"
sha1 = "0.11.0"
fastrand = "2"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry", "local-time"] }
tracing-appender = "0.2"
time = { version = "0.3", features = ["local-offset", "macros"] }
tiny_http = "0.12"
regex = "1"
unicode-normalization = "0.1"
aho-corasick = "1"
base64 = "0.22.1"
image = { version = "0.25", features = ["gif", "png"] }
rusqlite = { version = "0.32", features = ["bundled"] }
